name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
      - name: Build and start the production demo
        run: ruby bin/demo
      - name: Check the public demo over HTTP
        run: docker compose --env-file .env.demo -f compose.demo.yml exec -T web ruby bin/check-demo
      - name: Show demo logs on failure
        if: failure()
        run: docker compose --env-file .env.demo -f compose.demo.yml logs --tail 100
      - name: Stop the demo
        if: always()
        run: docker compose --env-file .env.demo -f compose.demo.yml down

  verify:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: course_workshop
      POSTGRES_PASSWORD: ci-only-password
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: course_workshop
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: course_workshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U course_workshop -d course_workshop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install image processing library
        run: sudo apt-get update -qq && sudo apt-get install -y libvips

      - name: Prepare test database
        run: ruby bin/rails db:prepare

      - name: Check autoloading
        run: ruby bin/rails zeitwerk:check

      - name: Check Ruby style
        run: ruby bin/rubocop

      - name: Scan application security
        run: ruby bin/brakeman --no-pager

      - name: Audit Ruby dependencies
        run: ruby bin/bundler-audit

      - name: Audit JavaScript dependencies
        run: npm audit

      - name: Run application tests
        run: ruby bin/rails test

      - name: Run browser tests
        run: ruby bin/rails test:system

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tmp/screenshots
          if-no-files-found: ignore
