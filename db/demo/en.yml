category: Statistics
course:
  slug: demo-statistics-over-coffee
  language: en
  title: Statistics over coffee
  description: How long do you really wait for coffee? In four short lessons, go from a measurement to a useful conclusion. Learn about the mean and median, read a chart, and check your calculations in Ruby. Basic arithmetic is enough; you can follow the code without knowing the language. All data is invented for teaching.
